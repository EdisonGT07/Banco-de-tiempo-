spring.application.name=pasaporte-saberes
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

pasaporte-saberes.cuentas.bono-inicial=${PASAPORTE_BONO_INICIAL}
pasaporte-saberes.sesiones.vigencia-handshake=${PASAPORTE_VIGENCIA_HANDSHAKE}
pasaporte-saberes.pasaporte.rating-minimo-validacion=${PASAPORTE_RATING_MINIMO_VALIDACION}
pasaporte-saberes.pasaporte.aprendices-minimos-validacion=${PASAPORTE_APRENDICES_MINIMOS_VALIDACION}
pasaporte-saberes.horas.tope-saldo=${PASAPORTE_TOPE_SALDO:40.00}
pasaporte-saberes.fondo.maximo-retiro-mensual=${PASAPORTE_MAX_RETIRO_FONDO_MENSUAL:5.00}
pasaporte-saberes.evidencias.maximo-bytes=${PASAPORTE_EVIDENCIA_MAX_BYTES:5242880}
spring.servlet.multipart.max-file-size=${PASAPORTE_EVIDENCIA_MAX_BYTES:5MB}
spring.servlet.multipart.max-request-size=${PASAPORTE_EVIDENCIA_MAX_REQUEST_BYTES:6MB}

supabase.storage.url=${SUPABASE_URL:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:evidencias}
supabase.storage.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
pasaporte-saberes.notificaciones.from=${PASAPORTE_NOTIFICACIONES_FROM:}

security.jwt.secret-base64=${JWT_SECRET_BASE64}
security.jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL:PT15M}
security.cors.allowed-origins=${CORS_ORIGINS:}
security.document-hmac.secret=${DOC_PEPPER}
security.credential-signature.secret=${FIRMA_CLAVE}